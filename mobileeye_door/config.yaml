---
name: MobileEyeDoor Bridge
version: "1.0.11"
slug: mobileeye_door
description: >-
  Live video from CTV / XiongMai video doorbells (MobileEyeDoor+ / uCareHome,
  e.g. CTV-M4101AHD) as standard RTSP/WebRTC cameras in Home Assistant.
url: https://github.com/steel0rat/mobileEyeDoor
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
map:
  - share:rw
ports:
  8554/tcp: 8554
  1984/tcp: 1984
  8555/tcp: 8555
ports_description:
  8554/tcp: RTSP streams (rtsp://<host>:8554/<camera>)
  1984/tcp: go2rtc web UI / API
  8555/tcp: WebRTC media (TCP) — needs webrtc_ip set
options:
  host: ""
  port: 10510
  login_hex: ""
  webrtc_ip: ""
  cameras:
    - channel: 1
      name: doorbell
schema:
  host: str
  port: port
  login_hex: password
  webrtc_ip: "str?"
  cameras:
    - channel: list(1|2|3|4)
      name: str
